name: Deploy web environment

# Production auto-deploys on every push to `main`, same trigger and the same
# reasoning as deploy-api-environment.yml (see its header comment) -- `main`
# only ever advances via the release cockpit's staging -> main promotion,
# which already required a human to verify staging first. Staging itself
# already auto-deploys on every push to `staging` (deploy-staging.yml).
# `workflow_dispatch` still exists for staging deploys here and for a manual
# re-run of production; on that path the typed confirmation is still
# required exactly as before.
#
# Both this workflow and the API one trigger independently off the same push
# -- fine for an already-bootstrapped environment (production's API Worker
# already exists, so the storefront's service binding always resolves). The
# "deploy API first" ordering only matters for an environment's very first
# ever deploy, which is a workflow_dispatch scenario, not this one.
#
# Requires the same repository secret every other deploy workflow uses:
#   CLOUDFLARE_API_TOKEN — a token with Workers Scripts edit permission on
#   the target account.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated Cloudflare environment
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Type DEPLOY staging or DEPLOY production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: "68185599d29e656475ecc2cabbf581b7"
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  CONFIRMATION: ${{ inputs.confirmation || 'DEPLOY production' }}

jobs:
  web:
    name: Storefront + Admin + Process + Language Studio (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Assert deployment target
        run: |
          test "$CONFIRMATION" = "DEPLOY $TARGET_ENVIRONMENT"
          test "$TARGET_ENVIRONMENT" = "staging" -o "$TARGET_ENVIRONMENT" = "production"

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # @cloudflare/vite-plugin selects its wrangler.jsonc "env" block at BUILD
      # time via CLOUDFLARE_ENV, not at deploy time -- see deploy-staging.yml's
      # matching step for the full explanation.
      - name: Build storefront (Cloudflare Workers)
        working-directory: apps/storefront
        env:
          CLOUDFLARE_ENV: ${{ inputs.environment || 'production' }}
          VITE_GOOGLE_CLIENT_ID: "550781007803-reqflk6ao179tttf6a3n150ft96dgekl.apps.googleusercontent.com"
        run: pnpm build
      - name: Deploy storefront
        working-directory: apps/storefront
        run: pnpm exec wrangler deploy --env "$TARGET_ENVIRONMENT"

      - name: Build admin
        working-directory: apps/admin
        env:
          VITE_GOOGLE_CLIENT_ID: "550781007803-reqflk6ao179tttf6a3n150ft96dgekl.apps.googleusercontent.com"
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            export VITE_API_URL="https://api.truegritin.com"
          else
            export VITE_API_URL="https://apistag.truegritin.com"
          fi
          pnpm build
      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env "$TARGET_ENVIRONMENT"

      - name: Build release process
        working-directory: apps/process
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            export VITE_API_URL="https://api.truegritin.com"
          else
            export VITE_API_URL="https://apistag.truegritin.com"
          fi
          pnpm build
      - name: Deploy release process
        working-directory: apps/process
        run: pnpm exec wrangler deploy --env "$TARGET_ENVIRONMENT"

      - name: Build language studio
        working-directory: apps/lang
        run: |
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            export VITE_API_URL="https://api.truegritin.com"
          else
            export VITE_API_URL="https://apistag.truegritin.com"
          fi
          pnpm build
      - name: Deploy language studio
        working-directory: apps/lang
        run: pnpm exec wrangler deploy --env "$TARGET_ENVIRONMENT"

      - name: Verify live endpoints
        # A bare curl User-Agent trips Cloudflare Bot Fight Mode's heuristics
        # (no browser fingerprint), which returns 403 before the request ever
        # reaches the Worker -- Bot Fight Mode runs outside the Ruleset Engine,
        # so no WAF Skip rule can except a path from it, only a plan upgrade to
        # Super Bot Fight Mode can. A realistic User-Agent is the correct,
        # zero-risk fix: it doesn't touch site security posture at all.
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            storefront_url="https://truegritin.com"
            admin_url="https://admin.truegritin.com"
            process_url="https://process.truegritin.com"
            language_url="https://lang.truegritin.com"
          else
            storefront_url="https://stag.truegritin.com"
            admin_url="https://adstag.truegritin.com"
            process_url=""
            language_url="https://langstag.truegritin.com"
          fi
          curl --fail --retry 5 --retry-all-errors -A "$UA" "$storefront_url"
          curl --fail --retry 5 --retry-all-errors -A "$UA" "$admin_url"
          curl --fail --retry 5 --retry-all-errors -A "$UA" "$language_url"
          if [ -n "$process_url" ]; then
            curl --fail --retry 5 --retry-all-errors -A "$UA" "$process_url"
          fi
