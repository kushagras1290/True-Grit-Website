name: Deploy dev

# Auto-deploys the whole project to the Cloudflare dev environment on every push
# to main/Testing (or manual dispatch). Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — a token with Workers Scripts, D1, R2, KV, and Queues
#   edit permissions on the target account.
on:
  push:
    branches: [main, Testing]
  workflow_dispatch:

permissions:
  contents: read

# Serialize dev deploys so concurrent pushes never race the same Workers.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: "68185599d29e656475ecc2cabbf581b7"

jobs:
  api:
    name: API (Python Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Separates "the token cannot reach D1" from "the SQL was rejected".
      # Both surface as failures on the step below, but they need opposite
      # fixes -- a new API token vs. a corrected migration -- and D1 reports
      # the second as `not authorized: SQLITE_AUTH`, which reads like the
      # first. Never fails the build: it is evidence, not a gate.
      - name: Check Cloudflare credentials reach D1
        working-directory: apps/api
        continue-on-error: true
        run: |
          npx --yes wrangler@4.110.0 whoami
          npx --yes wrangler@4.110.0 d1 info truegrit-dev
      # Idempotent: already-applied migrations are skipped. Keeps the D1 schema
      # in sync when a push adds new migration files.
      #
      # Applied one file at a time rather than in one `wrangler d1 migrations
      # apply` call: the remote D1 backend has been seen rejecting a batch of
      # several pending migrations at once with "too many terms in compound
      # SELECT" (SQLITE_ERROR 7500), even though every file applies cleanly
      # on its own and against local SQLite (scripts/validate_migrations.py).
      # This is a wrangler/D1 remote-batching quirk, not a defect in any one
      # migration's SQL -- see https://github.com/cloudflare/workers-sdk/issues/6347
      # for the same symptom (works --local, fails --remote). Hiding every
      # migration file, then restoring and applying exactly one per
      # invocation, guarantees a single-file batch regardless of wherever
      # wrangler's own threshold actually sits. Still fully idempotent: a
      # rerun after a partial failure only ever sees the files D1 has not
      # already recorded as applied.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: |
          set -e
          migrations_dir="../../database/migrations"
          hold_dir="$(mktemp -d)"
          mv "$migrations_dir"/*.sql "$hold_dir"/
          for file in "$hold_dir"/*.sql; do
            mv "$file" "$migrations_dir"/
            npx --yes wrangler@4.110.0 d1 migrations apply truegrit-dev --remote
          done
      # pywrangler bundles FastAPI/pydantic + the workers/asgi runtime SDK and
      # deploys the Python Worker. The Pyodide venv step only works on Linux,
      # which is why the API is deployed from CI rather than a dev machine.
      - name: Deploy API
        working-directory: apps/api
        run: uvx --from workers-py pywrangler deploy

  web:
    name: Storefront + Admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public build-time config. VITE_API_URL points the SSR/browser code at
      # the deployed API (not localhost); VITE_GOOGLE_CLIENT_ID enables the
      # "Sign in with Google" button. Both are public (no secrets).
      VITE_API_URL: "https://truegrit-api-dev.kushagras1234890.workers.dev"
      VITE_GOOGLE_CLIENT_ID: "550781007803-reqflk6ao179tttf6a3n150ft96dgekl.apps.googleusercontent.com"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build storefront (Cloudflare Workers)
        working-directory: apps/storefront
        run: pnpm build
      - name: Deploy storefront
        working-directory: apps/storefront
        run: pnpm exec wrangler deploy
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy
