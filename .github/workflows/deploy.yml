name: Deploy testing

# Auto-deploys the whole project to the Cloudflare testing environment on every
# push to `testing` (or manual dispatch). The existing top-level dev resources
# form the testing data plane, while reviewers use test.truegritin.com and
# adtest.truegritin.com instead of workers.dev URLs. Requires one repository secret:
#   CLOUDFLARE_API_TOKEN — a token with Workers Scripts, D1, R2, KV, and Queues
#   edit permissions on the target account.
#
# Production remains behind the typed-confirmation deploy workflows after the
# testing -> staging -> main promotion path.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

# Serialize testing deploys so concurrent pushes never race the same Workers.
concurrency:
  group: deploy-testing
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: "68185599d29e656475ecc2cabbf581b7"

jobs:
  api:
    name: API (Python Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Separates "the token cannot reach D1" from "the SQL was rejected".
      # Both surface as failures on the step below, but they need opposite
      # fixes -- a new API token vs. a corrected migration -- and D1 reports
      # the second as `not authorized: SQLITE_AUTH`, which reads like the
      # first. Never fails the build: it is evidence, not a gate.
      - name: Check Cloudflare credentials reach D1
        working-directory: apps/api
        continue-on-error: true
        run: |
          npx --yes wrangler@4.110.0 whoami
          npx --yes wrangler@4.110.0 d1 info truegrit-dev
      # Idempotent: already-applied migrations are skipped. Keeps the D1 schema
      # in sync when a push adds new migration files.
      #
      # Applied one file at a time rather than in one `wrangler d1 migrations
      # apply` call: the remote D1 backend has been seen rejecting a batch of
      # several pending migrations at once with "too many terms in compound
      # SELECT" (SQLITE_ERROR 7500), even though every file applies cleanly
      # on its own and against local SQLite (scripts/validate_migrations.py).
      # This is a wrangler/D1 remote-batching quirk, not a defect in any one
      # migration's SQL -- see https://github.com/cloudflare/workers-sdk/issues/6347
      # for the same symptom (works --local, fails --remote). Hiding every
      # migration file, then restoring and applying exactly one per
      # invocation, guarantees a single-file batch regardless of wherever
      # wrangler's own threshold actually sits. Still fully idempotent: a
      # rerun after a partial failure only ever sees the files D1 has not
      # already recorded as applied.
      - name: Apply D1 migrations
        working-directory: apps/api
        run: |
          set -e
          migrations_dir="../../database/migrations"
          hold_dir="$(mktemp -d)"
          mv "$migrations_dir"/*.sql "$hold_dir"/
          for file in "$hold_dir"/*.sql; do
            mv "$file" "$migrations_dir"/
            # D1's remote storage layer occasionally times out mid-operation
            # ("D1 DB storage operation exceeded timeout... [code: 7429]"), a
            # transient Cloudflare-side condition unrelated to the migration's
            # SQL. The apply is idempotent (already-applied files are
            # skipped), so retrying the same command is always safe.
            attempt=1
            until npx --yes wrangler@4.110.0 d1 migrations apply truegrit-dev --remote; do
              if [ "$attempt" -ge 3 ]; then
                echo "d1 migrations apply failed after $attempt attempts" >&2
                exit 1
              fi
              echo "d1 migrations apply failed (attempt $attempt) -- retrying in 10s" >&2
              attempt=$((attempt + 1))
              sleep 10
            done
          done
      # pywrangler bundles FastAPI/pydantic + the workers/asgi runtime SDK and
      # deploys the Python Worker. The Pyodide venv step only works on Linux,
      # which is why the API is deployed from CI rather than a dev machine.
      - name: Deploy API
        working-directory: apps/api
        run: uvx --from workers-py pywrangler deploy

  web:
    name: Storefront + Admin + Process + Language Studio + SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: api
    env:
      # Public build-time config. VITE_API_URL points the SSR/browser code at
      # the deployed API (not localhost); VITE_GOOGLE_CLIENT_ID enables the
      # "Sign in with Google" button. Both are public (no secrets).
      VITE_API_URL: "https://apitest.truegritin.com"
      VITE_GOOGLE_CLIENT_ID: "550781007803-reqflk6ao179tttf6a3n150ft96dgekl.apps.googleusercontent.com"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build storefront (Cloudflare Workers)
        working-directory: apps/storefront
        run: pnpm build
      - name: Deploy storefront
        working-directory: apps/storefront
        run: pnpm exec wrangler deploy
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy
      - name: Build release process
        working-directory: apps/process
        run: pnpm build
      - name: Deploy release process
        working-directory: apps/process
        run: pnpm exec wrangler deploy
      - name: Build language studio
        working-directory: apps/lang
        run: pnpm build
      - name: Deploy language studio
        working-directory: apps/lang
        run: pnpm exec wrangler deploy
      - name: Build SEO studio
        working-directory: apps/seo
        env:
          VITE_API_URL: "https://apitest.truegritin.com"
        run: pnpm build
      - name: Deploy SEO studio
        working-directory: apps/seo
        run: pnpm exec wrangler deploy
      - name: Verify testing domains
        # A bare curl User-Agent trips Cloudflare Bot Fight Mode's heuristics
        # (no browser fingerprint), which returns 403 before the request ever
        # reaches the Worker -- Bot Fight Mode runs outside the Ruleset Engine,
        # so no WAF Skip rule can except a path from it, only a plan upgrade to
        # Super Bot Fight Mode can. A realistic User-Agent is the correct,
        # zero-risk fix: it doesn't touch site security posture at all.
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://apitest.truegritin.com/health/live
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://test.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://adtest.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://langtest.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://seotest.truegritin.com
