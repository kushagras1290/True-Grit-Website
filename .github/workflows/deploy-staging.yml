name: Deploy staging

# Auto-deploys the whole project to the isolated Cloudflare staging
# environment on every push to `staging` OR `main`. This is the middle rung
# of the promotion ladder: `testing` (CI + testing deploy) -> `staging` (this
# workflow) -> `main` (also this workflow, so staging always mirrors what's
# about to ship, kept fresh with zero manual step -- production deploys
# remain manually gated via deploy-api-environment.yml/
# deploy-web-environment.yml's typed confirmation). Requires one repository
# secret, the same one deploy.yml and deploy-api-environment.yml already
# use:
#   CLOUDFLARE_API_TOKEN — a token with Workers Scripts, D1, R2, KV, and
#   Queues edit permissions on the target account.
#
# The isolated staging D1/R2/Queues/KV resources (truegrit-staging,
# truegrit-media-staging, truegrit-jobs-staging, etc.) already exist — see
# apps/api/wrangler.jsonc's env.staging block. The "Verify isolated
# resources exist" step below re-checks that at deploy time so a resource
# getting deleted out from under this fails with a clear message instead of
# a cryptic wrangler error mid-deploy.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize staging deploys so concurrent pushes never race the same Workers.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: "68185599d29e656475ecc2cabbf581b7"

jobs:
  api:
    name: API (Python Worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify isolated resources exist
        working-directory: apps/api
        run: |
          npx --yes wrangler@4.110.0 whoami
          npx --yes wrangler@4.110.0 d1 info truegrit-staging
          npx --yes wrangler@4.110.0 queues info truegrit-jobs-staging
          npx --yes wrangler@4.110.0 queues info truegrit-dlq-staging
          npx --yes wrangler@4.110.0 r2 bucket info truegrit-media-staging
          npx --yes wrangler@4.110.0 r2 bucket info truegrit-exports-staging

      # Idempotent, one migration file per invocation — see deploy.yml's
      # matching step for why (remote D1 rejects large compound-SELECT
      # migration batches even though each file applies cleanly alone).
      - name: Apply D1 migrations
        working-directory: apps/api
        run: |
          set -e
          migrations_dir="../../database/migrations"
          hold_dir="$(mktemp -d)"
          mv "$migrations_dir"/*.sql "$hold_dir"/
          for file in "$hold_dir"/*.sql; do
            mv "$file" "$migrations_dir"/
            # D1's remote storage layer occasionally times out mid-operation
            # ("D1 DB storage operation exceeded timeout... [code: 7429]"), a
            # transient Cloudflare-side condition unrelated to the migration's
            # SQL. The apply is idempotent (already-applied files are
            # skipped), so retrying the same command is always safe.
            attempt=1
            until npx --yes wrangler@4.110.0 d1 migrations apply DB --env staging --remote; do
              if [ "$attempt" -ge 3 ]; then
                echo "d1 migrations apply failed after $attempt attempts" >&2
                exit 1
              fi
              echo "d1 migrations apply failed (attempt $attempt) -- retrying in 10s" >&2
              attempt=$((attempt + 1))
              sleep 10
            done
          done

      - name: Deploy API
        working-directory: apps/api
        run: uvx --from workers-py pywrangler deploy --env staging

  web:
    name: Storefront + Admin + Process + Language Studio + SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    # The storefront's service binding (API_WORKER) targets truegrit-api-staging
    # by name, which Cloudflare validates at deploy time -- if that Worker has
    # never been deployed before, the binding fails with "Worker ... was not
    # found" even though this job's own build has nothing to do with the API.
    # deploy.yml (main/dev) doesn't need this because truegrit-api-dev has
    # existed for months; this ordering only matters for an environment's
    # very first deploy. Confirmed by hitting exactly this failure on
    # staging's first run (2026-08-06).
    needs: api
    env:
      VITE_API_URL: "https://apistag.truegritin.com"
      VITE_GOOGLE_CLIENT_ID: "550781007803-reqflk6ao179tttf6a3n150ft96dgekl.apps.googleusercontent.com"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @cloudflare/vite-plugin selects its wrangler.jsonc "env" block at BUILD
      # time via CLOUDFLARE_ENV, not at deploy time -- `wrangler deploy --env`
      # is a no-op here because the build already flattened one environment's
      # config into dist/server/wrangler.json. Confirmed empirically: without
      # this, the build silently keeps the top-level (dev) name/vars/service
      # binding even when the deploy step below passes --env staging.
      # https://developers.cloudflare.com/workers/vite-plugin/reference/cloudflare-environments/
      - name: Build storefront (Cloudflare Workers)
        working-directory: apps/storefront
        env:
          CLOUDFLARE_ENV: staging
        run: pnpm build
      - name: Deploy storefront
        working-directory: apps/storefront
        run: pnpm exec wrangler deploy --env staging
      - name: Build admin
        working-directory: apps/admin
        run: pnpm build
      - name: Deploy admin
        working-directory: apps/admin
        run: pnpm exec wrangler deploy --env staging
      - name: Build release process
        working-directory: apps/process
        env:
          VITE_API_URL: "https://apistag.truegritin.com"
        run: pnpm build
      - name: Deploy release process
        working-directory: apps/process
        run: pnpm exec wrangler deploy --env staging
      - name: Build language studio
        working-directory: apps/lang
        run: pnpm build
      - name: Deploy language studio
        working-directory: apps/lang
        run: pnpm exec wrangler deploy --env staging
      - name: Build SEO studio
        working-directory: apps/seo
        run: pnpm build
      - name: Deploy SEO studio
        working-directory: apps/seo
        run: pnpm exec wrangler deploy --env staging
      - name: Verify staging domains
        # A bare curl User-Agent trips Cloudflare Bot Fight Mode's heuristics
        # (no browser fingerprint), which returns 403 before the request ever
        # reaches the Worker -- Bot Fight Mode runs outside the Ruleset Engine,
        # so no WAF Skip rule can except a path from it, only a plan upgrade to
        # Super Bot Fight Mode can. A realistic User-Agent is the correct,
        # zero-risk fix: it doesn't touch site security posture at all.
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://apistag.truegritin.com/health/live
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://stag.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://adstag.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://langstag.truegritin.com
          curl --fail --retry 5 --retry-all-errors -A "$UA" https://seostag.truegritin.com
