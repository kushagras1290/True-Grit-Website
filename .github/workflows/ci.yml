name: CI

# `testing` is where work lands and is validated; `staging` and `main` only
# receive what has already proven out there. All three need checks: gating
# main alone would mean "it works on testing" was never actually verified by
# anything.
on:
  pull_request:
  push:
    branches: [main, staging, testing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` input — the action reads `packageManager` from
      # package.json. Specifying both makes it fail outright with "Multiple
      # versions of pnpm specified". deploy.yml already omits it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      # Fails when storefront copy is added without being routed through the
      # translation catalogue, which is how the site ended up part-translated.
      - run: pnpm i18n:audit
      - run: pnpm test
      # Guards the translation quality gate. `pnpm test` is recursive over
      # workspace packages and never reaches scripts/, which is how the
      # backfill shipped without checks on what it wrote to the database.
      - run: pnpm test:scripts
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=src --cov-report=term-missing

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate migrations, foreign keys, and seeds
        run: python3 scripts/validate_migrations.py
