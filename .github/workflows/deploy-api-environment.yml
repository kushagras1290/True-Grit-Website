name: Deploy API environment

# Production auto-deploys on every push to `main` (that branch only ever
# advances via the release cockpit's staging -> main promotion, which already
# required a human to verify staging first -- see apps/process/README.md).
# `workflow_dispatch` still exists for staging deploys and for a manual
# re-run of production (rollback-forward, retrying a failed run, etc.); on
# that path the typed confirmation is still required exactly as before. A
# push-triggered run has no human typing a confirmation, so `inputs.*` is
# empty and both TARGET_ENVIRONMENT/CONFIRMATION fall back to "production" --
# push to `main` can only ever mean production, so this is not a weakened
# check, just the same assertion synthesized instead of typed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated Cloudflare environment
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Type DEPLOY staging or DEPLOY production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: API (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "68185599d29e656475ecc2cabbf581b7"
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      CONFIRMATION: ${{ inputs.confirmation || 'DEPLOY production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assert deployment target
        run: |
          test "$CONFIRMATION" = "DEPLOY $TARGET_ENVIRONMENT"
          test "$TARGET_ENVIRONMENT" = "staging" -o "$TARGET_ENVIRONMENT" = "production"
          npx --yes wrangler@4.110.0 whoami

      - name: Verify isolated resources exist
        working-directory: apps/api
        run: |
          suffix="$TARGET_ENVIRONMENT"
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then suffix="prod"; fi
          npx --yes wrangler@4.110.0 d1 info "truegrit-$suffix"
          npx --yes wrangler@4.110.0 queues info "truegrit-jobs-$suffix"
          npx --yes wrangler@4.110.0 queues info "truegrit-dlq-$suffix"
          npx --yes wrangler@4.110.0 r2 bucket info "truegrit-media-$suffix"
          npx --yes wrangler@4.110.0 r2 bucket info "truegrit-exports-$suffix"

      - name: Validate code and configuration
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run pytest
          npx --yes wrangler@4.110.0 deploy --dry-run --env "$TARGET_ENVIRONMENT"

      - name: Apply D1 migrations one at a time
        working-directory: apps/api
        run: |
          set -e
          migrations_dir="../../database/migrations"
          hold_dir="$(mktemp -d)"
          mv "$migrations_dir"/*.sql "$hold_dir"/
          for file in "$hold_dir"/*.sql; do
            mv "$file" "$migrations_dir"/
            # D1's remote storage layer occasionally times out mid-operation
            # ("D1 DB storage operation exceeded timeout... [code: 7429]"), a
            # transient Cloudflare-side condition unrelated to the migration's
            # SQL. The apply is idempotent (already-applied files are
            # skipped), so retrying the same command is always safe.
            attempt=1
            until npx --yes wrangler@4.110.0 d1 migrations apply DB \
              --env "$TARGET_ENVIRONMENT" --remote; do
              if [ "$attempt" -ge 3 ]; then
                echo "d1 migrations apply failed after $attempt attempts" >&2
                exit 1
              fi
              echo "d1 migrations apply failed (attempt $attempt) -- retrying in 10s" >&2
              attempt=$((attempt + 1))
              sleep 10
            done
          done

      - name: Deploy Python Worker
        working-directory: apps/api
        run: uvx --from workers-py pywrangler deploy --env "$TARGET_ENVIRONMENT"

      - name: Verify live endpoint
        # A bare curl User-Agent trips Cloudflare Bot Fight Mode's heuristics
        # (no browser fingerprint), which returns 403 before the request ever
        # reaches the Worker -- Bot Fight Mode runs outside the Ruleset Engine,
        # so no WAF Skip rule can except a path from it, only a plan upgrade to
        # Super Bot Fight Mode can. A realistic User-Agent is the correct,
        # zero-risk fix: it doesn't touch site security posture at all.
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          if [ "$TARGET_ENVIRONMENT" = "production" ]; then
            api_url="https://api.truegritin.com"
          else
            api_url="https://apistag.truegritin.com"
          fi
          curl --fail --retry 5 --retry-all-errors -A "$UA" "$api_url/health/live"
