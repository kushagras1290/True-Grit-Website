[project]
name = "truegrit-api"
version = "0.1.0"
description = "True Grit marketplace API — FastAPI for Cloudflare Python Workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "uvicorn>=0.32",
    # Cloudflare Python Workers toolchain: `pywrangler` bundles the app + its
    # PyPI dependencies for deployment; `workers-runtime-sdk` supplies the
    # `workers`/`asgi` runtime modules (and IDE type stubs) used by worker.py.
    "workers-py>=1.90",
    "workers-runtime-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truegrit_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/truegrit_api"]
